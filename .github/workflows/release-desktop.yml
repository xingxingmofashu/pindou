name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: arm64
            platform: mac
          - os: windows-latest
            target: x64
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        run: pnpm --filter @pindou/desktop make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.exe
            # Squirrel update metadata + packages (Windows auto-update needs
            # RELEASES and the full nupkg, not just the setup exe).
            apps/desktop/out/make/**/RELEASES
            apps/desktop/out/make/**/*.nupkg

  release:
    needs: build
    runs-on: ubuntu-latest
    # Creating the release + uploading assets requires contents: write.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Pindou Desktop

            Desktop editor for fuse bead patterns.

            ### macOS
            The app is **not signed** (beta). If macOS reports "Pindou is damaged and can't be opened", run:

            ```bash
            xattr -cr /Applications/Pindou.app
            ```

            Or right-click the app in Finder → **Open** → **Open** again.

            ### Windows
            The installer is not signed, so SmartScreen may warn. Click **More info** → **Run anyway**.

            ### Install
            1. Download the `.dmg` (macOS) or `.exe` (Windows) for your platform.
            2. macOS: open the dmg and drag Pindou into Applications.
            3. Windows: run the installer and follow the prompts.
          files: |
            **/*.dmg
            **/*.zip
            **/*.exe
            **/RELEASES
            **/*.nupkg
          # Full release (not a prerelease), so auto-update's `latest`
          # resolves to it.
          generate_release_notes: true
          # Version-less asset names: allow overwriting assets already on the
          # release (e.g. when re-running the workflow for the same version).
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
